# The json-file log driver does not rotate by default. On this box that is a
# disk problem before it is a logging problem: / is 80% full and shared with
# k3s, another app's Postgres and this stack's database, and one crash-looping
# container or one bot walking the marketing site writes gigabytes of access
# logs with nothing to stop it. 30MB per service, capped.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Shared box: several other applications and a k3s cluster live here, so a
    # runaway container must hit a wall rather than take the host with it.
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    # Upstream defaults assume a machine several times this size. Inside the
    # 768M cap above, 100 backends at a few megabytes each plus work_mem for a
    # report query is enough to trip the cgroup OOM killer, and Postgres answers
    # a killed child by disconnecting every session and entering crash recovery
    # — the whole site 500s until it finishes. The API pool asks for at most 10
    # connections, so 50 is generous and bounded.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
    # Parallel workers pass tuples through POSIX shared memory, which Docker
    # caps at 64MB by default; past that they fail the query outright with
    # "could not resize shared memory segment".
    #
    # 128MB, not more: this is a tmpfs, and its pages are charged to the same
    # 768M cgroup as Postgres itself. The budget it has to fit inside is
    # shared_buffers (128MB, the image default) + up to 50 backends + whatever
    # of this is actually touched — raising it to 256MB would leave the sum
    # close enough to the cap that a busy report could push the container into
    # the OOM killer it is meant to be kept away from. Unused pages cost
    # nothing, so this is a ceiling, not a reservation.
    shm_size: 128mb
    environment:
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: bossclinician
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d bossclinician"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    # Shared box: several other applications and a k3s cluster live here, so a
    # runaway container must hit a wall rather than take the host with it.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    build: ./ai
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    env_file: ./ai/.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    # Shared box: several other applications and a k3s cluster live here, so a
    # runaway container must hit a wall rather than take the host with it.
    # Wider than the other services because this process also renders the
    # marketing pages: the React tree, its markdown renderer and the compiled
    # server bundle all live in this heap alongside the API.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    build:
      # The repository root, because the image carries the server-rendering
      # build of the React app as well as the API — see backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
      # Explicit, because this Dockerfile has a second runtime stage after it
      # (`web`, below) and the last stage is what an untargeted build produces.
      target: api
      args:
        VITE_API_BASE: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        # The git commit, reported by /api/health. scripts/deploy.sh sets it.
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    # Two files, in this order. The API needs OPENAI_API_KEY for the voice
    # concierge: /api/voice/connect trades the browser's SDP offer with OpenAI
    # server-side precisely so the key never reaches the page, and /api/voice/chat
    # runs the same assistant typed. The key already lives in ai/.env, so it is
    # read from there rather than copied — one secret in one file on this host,
    # and no way for the two to drift apart or for one of them to be rotated
    # alone. ai/.env also carries OPENAI_BASE_URL, which the API reads so both
    # halves reach OpenAI by the same road. It carries OPENAI_MODEL too, and the
    # API deliberately does NOT read that one: it names the AI service's chat
    # model, while the concierge's models are pinned in
    # backend/src/services/voice/contract.ts and handed to the browser from
    # there. Reading it here would silently swap the brain behind the voice.
    #
    # backend/.env is listed LAST on purpose: later files win, so this service's
    # own configuration always beats anything the AI service happens to set now
    # or adds later.
    env_file:
      - ./ai/.env
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://boss:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/bossclinician
      AI_BASE_URL: http://ai:8000
      UPLOAD_DIR: /app/uploads
      PROTECTED_UPLOAD_DIR: /app/uploads-protected
      # Keep in sync with nginx client_max_body_size in nginx/site.conf.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      # From the root .env, the same values the coturn service below is
      # started with. Here rather than in backend/.env because two services
      # need them to agree: the API mints the credentials this relay checks,
      # and a mismatch is a room that gathers no relay candidates and fails
      # only for the users behind symmetric NAT — the hardest failure here to
      # notice. `environment:` wins over `env_file:`, so this is the value
      # that reaches the process.
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
    volumes:
      # Named volumes, not bind mounts: uploaded media must survive
      # `docker compose build` / container replacement.
      #
      # Two of them, because the app keeps two storage roots. /app/uploads is
      # served at /uploads to anyone who asks and holds blog covers, testimonial
      # photos and avatars. /app/uploads-protected holds everything a customer
      # paid for and is reachable only through a signed link. Nesting the second
      # inside the first would put every course video back on the open web.
      - uploads_data:/app/uploads
      - protected_uploads_data:/app/uploads-protected
    expose:
      - "4000"
    # Startup runs the migrations and the first-boot seed before it listens, so
    # a deploy script (and nginx below) has to wait for this rather than for the
    # container merely existing. start_period covers that work without counting
    # its slowness as failures.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Five minutes, sized for the worst case rather than the normal one. On a
      # fresh volume this process applies schema.sql, then eighteen migrations,
      # then the full first-boot seed, all before it binds the port — on two
      # shared cores that is minutes, not seconds. Checks that fail inside
      # start_period do not count as failures, so a generous value costs
      # nothing on a normal boot; too small a value would mark the API failed
      # and take the whole stack down with "dependency failed to start", on the
      # one path where that matters most: rebuilding from an empty database.
      start_period: 300s
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    # Shared box: several other applications and a k3s cluster live here, so a
    # runaway container must hit a wall rather than take the host with it.
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    build:
      # The same context, Dockerfile and args as the backend service on purpose:
      # BuildKit then recognises the Vite build as one piece of work and runs it
      # once. Built separately they were two ~2GB builds racing each other on an
      # 8GB box that is also running k3s and the live database, and they could
      # disagree about the browser bundle's content hashes — which the API's
      # server-rendered HTML names directly.
      context: .
      dockerfile: backend/Dockerfile
      target: web
      args:
        VITE_API_BASE: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        # Consumed only by the api stage; listed so the two services keep
        # identical args, as the comment above requires.
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "80"

  nginx:
    # Shared box: several other applications and a k3s cluster live here, so a
    # runaway container must hit a wall rather than take the host with it.
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    image: nginx:1.31-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    ports:
      - "10.42.0.1:8088:80"   # bound to the cni0 gateway on this host; k3s Traefik reaches it here (not public)
    volumes:
      # The whole directory, not two single-file mounts. A single-file bind
      # mount pins the *inode*: every editor and every script that writes by
      # rename (write a temp file, rename it over the target — which is what
      # sed -i, python's write_text and generate-nginx-redirects.js all do)
      # leaves the container holding the old file forever. It looks like a
      # deploy and is not one: `nginx -s reload` and `docker compose restart
      # nginx` both re-read a file that has not changed, silently, with no
      # error anywhere. Mounting the directory means the container resolves the
      # name each time and sees the current file.
      #
      # site.conf lands at /etc/nginx/conf.d/site.conf and is picked up by the
      # base image's `include /etc/nginx/conf.d/*.conf`; mounting over the
      # whole directory also removes that image's stock default.conf, which
      # would otherwise fight this one for port 80. redirects.map is included
      # by site.conf by absolute path and is not a .conf, so it is not loaded
      # twice. Anything else ending in .conf dropped in ./nginx WILL be loaded.
      #
      # redirects.map is generated from the `redirects` table by
      # backend/scripts/generate-nginx-redirects.js. Regenerate and reload
      # after editing redirects in the admin — see DEPLOY.md.
      - ./nginx:/etc/nginx/conf.d:ro
    # Conditions, not names: nginx resolves `backend` and `frontend` when it
    # loads its config, and it proxies the site's first request the moment it is
    # up. Waiting only for the containers to exist meant the first visitor after
    # a deploy could land on a 502 while the API was still migrating.
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  coturn:
    # This app's own TURN relay, deliberately separate from the telehealth
    # coturn that also runs on this box (a k3s deployment in the
    # callsphere-health namespace, realm health.callsphere.ai, port 3478).
    #
    # The two shared one relay and one --static-auth-secret for a while. That
    # worked, and it was still wrong on three counts:
    #   - The secret is a bearer key to the relay. Holding the clinical app's
    #     secret in this app's .env meant a leak here was a leak there, for an
    #     app under a different compliance story.
    #   - Rotating it for one app silently broke the other.
    #   - coturn's quotas are per-server, not per-realm. --total-quota was one
    #     shared pool, so a busy community room could refuse allocations to a
    #     telehealth consult. That is the wrong way round for which of these
    #     two is allowed to degrade.
    # Separate relay, separate secret, separate quotas fixes all three.
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    # Pinned to the full release and image revision, not a floating 4.x-alpine:
    # the command below is checked against one binary's option table, and
    # coturn has removed options in a minor release before (4.18 refuses to
    # start on 4.6's --no-tlsv1_1). Re-check the command on every bump.
    image: coturn/coturn:4.18.0-r0-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    # Host networking, not published ports. A relay hands out its own address
    # in ICE candidates and needs the whole --min-port/--max-port range
    # reachable; mapping 200 UDP ports through docker-proxy would both cost a
    # process per port and rewrite the source addresses the relay reports.
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=${TURN_PORT:?TURN_PORT is required}
      # Nothing may bind listening-port+1, coturn's RFC 5780 alternate port: on
      # this host an unrequested extra bind is how you collide with the
      # neighbouring relay. This flag is not what prevents it, though. 0 is
      # coturn's "unset" and still means listening-port+1 (get_alt_listener_port,
      # in 4.6 and 4.18 alike). The port stays unbound because RFC 5780 never
      # starts here: it is off unless --rfc5780 is given (coturn 4.7+), and
      # coturn refuses it anyway whenever --external-ip is set. The flag is
      # harmless and stays; the one never to add is --rfc5780.
      - --alt-listening-port=0
      - --listening-ip=0.0.0.0
      # The address handed out in candidates. Without it the relay advertises
      # whatever it sees locally, which on this box is a docker/flannel
      # address no browser can reach.
      - --external-ip=192.99.63.81
      - --relay-ip=0.0.0.0
      # Disjoint from the telehealth relay's 49160-49200, with a gap. One
      # relay port per allocation, so this range and --total-quota below are
      # the same number by intent, not coincidence.
      - --min-port=49210
      - --max-port=49409
      - --realm=bossclinician.callsphere.site
      # TURN REST API: the browser never sees this secret, only a short-lived
      # HMAC of a timestamped username minted from it by the API. Must match
      # TURN_STATIC_AUTH_SECRET in backend/.env.
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET is required}
      - --fingerprint
      # No CLI or TLS-version flags, on purpose: since coturn 4.10 both
      # restrictions are defaults, and the flags that used to force them are
      # now wrong.
      #   - The admin CLI is off unless --cli is given (coturn #1830).
      #     --no-cli is a no-op that logs an ERROR on every start.
      #   - TLS 1.0 and 1.1 are refused unless --tlsv1 or --tlsv1_1 is given
      #     (coturn #1693); the floor is TLS 1.2. --no-tlsv1_1 no longer
      #     exists and turnserver exits 255 on it. --no-tlsv1 must go too:
      #     getopt takes it as an abbreviation of --no-tlsv1_2, which silently
      #     raises the floor to TLS 1.3.
      # There is no --cert/--pkey, so this relay runs no TLS or DTLS listener
      # at all today; the TLS floor is what applies if it ever gets one. Never
      # add --tlsv1 or --tlsv1_1.
      - --no-multicast-peers
      # A live room caps at 16 (communities.live_room_capacity, 2..16), and a
      # browser in a mesh allocates per peer connection, so one member in a
      # full room can want ~15. 20 gives that headroom without letting a
      # single member take the server.
      - --user-quota=20
      - --total-quota=200
      - --max-bps=1500000
      # An open relay is an open proxy. Without these, anyone holding a minted
      # credential could ask this server to reach the host's own private
      # networks — which on this box means the k3s pod network (10.42/16, so
      # every telehealth service), both docker bridges and localhost.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  db_data:
  uploads_data:
  protected_uploads_data:
