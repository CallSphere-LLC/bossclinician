services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: bossclinician
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d bossclinician"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file: ./ai/.env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://boss:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/bossclinician
      AI_BASE_URL: http://ai:8000
      UPLOAD_DIR: /app/uploads
      # Keep in sync with nginx client_max_body_size in nginx/site.conf.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    volumes:
      # Named volume, not a bind mount: uploaded media must survive
      # `docker compose build` / container replacement.
      - uploads_data:/app/uploads
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "172.18.0.1:8088:80"   # bound to the k3d bridge gateway; k3s Traefik ingress hairpins here (not public)
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      # Generated from the `redirects` table by
      # backend/scripts/generate-nginx-redirects.js. Regenerate and
      # `nginx -s reload` after editing redirects in the admin.
      - ./nginx/redirects.map:/etc/nginx/conf.d/redirects.map:ro
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  uploads_data:
