# Adds www.bossclinician.com alongside the staging ingress. Namecheap keeps
# the apex URL redirect to www, including its existing HTTPS forwarding.
# Apply after www points to this server (currently 192.99.63.81).
#
#   kubectl apply -f k8s/ingress-bossclinician-com.yaml
#   kubectl -n bossclinician get certificate boss-web-com-tls -w
---
# HTTP: serves the ACME HTTP-01 challenge, then redirects everything to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-com-http
  namespace: bossclinician
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: www.bossclinician.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-com-https
  namespace: bossclinician
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: www.bossclinician.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
  tls:
    - hosts:
        - www.bossclinician.com
      secretName: boss-web-com-tls
