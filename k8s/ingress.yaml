# Routes bossclinician.callsphere.site (via k3s Traefik + cert-manager TLS)
# to the native K3s app deployment.
apiVersion: v1
kind: Namespace
metadata:
  name: bossclinician
---
# The selector routes public and admin traffic to the complete K3s app pod.
apiVersion: v1
kind: Service
metadata:
  name: boss-web
  namespace: bossclinician
spec:
  selector:
    app: boss-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-https
  namespace: bossclinician
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: bossclinician.callsphere.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
  tls:
    - hosts:
        - bossclinician.callsphere.site
      secretName: bossclinician-tls
---
# Plain HTTP ingress so cert-manager HTTP-01 solver + initial reachability work on port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-http
  namespace: bossclinician
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: bossclinician.callsphere.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
