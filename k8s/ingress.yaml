# Routes bossclinician.callsphere.site (via k3s Traefik + cert-manager TLS)
# to the isolated Docker Compose stack bound on the host bridge 172.18.0.1:8088.
apiVersion: v1
kind: Namespace
metadata:
  name: bossclinician
---
# Service with no selector — endpoints are managed manually (points at the host).
apiVersion: v1
kind: Service
metadata:
  name: boss-web
  namespace: bossclinician
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8088
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: boss-web            # must match the Service name
  namespace: bossclinician
subsets:
  - addresses:
      - ip: 172.18.0.1      # host, as seen from the k3d node's docker bridge
    ports:
      - name: http
        port: 8088
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-https
  namespace: bossclinician
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: bossclinician.callsphere.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
  tls:
    - hosts:
        - bossclinician.callsphere.site
      secretName: bossclinician-tls
---
# Plain HTTP ingress so cert-manager HTTP-01 solver + initial reachability work on port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boss-web-http
  namespace: bossclinician
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: bossclinician.callsphere.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boss-web
                port:
                  number: 80
