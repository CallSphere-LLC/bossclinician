name: Deployment instructions
# Production is released directly from the host, never by a GitHub runner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Direct release only
        run: echo 'Production deploys directly on K3s using ./scripts/deploy-k3s.sh. Git pushes run CI checks only.'
