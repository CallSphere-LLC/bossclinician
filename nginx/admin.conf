# This virtual host serves only trusted SPA assets and admin API routes.
# Public/member content and uploaded documents always live on the public host.
server {
    listen 80;
    server_name admin.bossclinician.callsphere.site;
    client_max_body_size 512m;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://bossclinician.callsphere.site https://*.stripe.com; media-src 'self' https://bossclinician.callsphere.site https://bossclinician-voice-recordings.s3.us-east-1.amazonaws.com blob:; connect-src 'self'; frame-src 'self' https://bossclinician.callsphere.site; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Absolute and https: a relative target is completed by nginx with the scheme it
    # sees, which behind the ingress is http — the admin's front door was redirecting
    # to http://.
    location = / { return 302 https://$host/admin; }
    # On the admin host, "login" means the admin login. It used to fall through to
    # the catch-all below and land on the CUSTOMER sign-in page.
    location ~ ^/(login|signin|sign-in|log-in)/?$ { return 302 https://$host/admin/login; }
    # index.html loads this before first paint; without it the catch-all bounced it
    # to the public origin, where the CSP (script-src 'self') then refused it.
    location = /theme-init.js { proxy_pass http://frontend:80; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
    # The voice and text concierge, which is not an admin API and so is not
    # under /api/admin/ — it serves all three surfaces and decides which one a
    # request gets from that request's own cookies.
    #
    # Without this block it fell to the catch-all at the bottom and was 302'd to
    # the public host. That is not a slow path, it is a broken one: fetch follows
    # the redirect, a POST becomes a GET, and the `__Host-` admin cookie is not
    # sent to another host at all — so a session Yvette opened in her own admin
    # came back resolved as `public`, silently, with no admin tools. Same headers
    # as the /api/admin/ block above; no request buffering, because the SDP offer
    # is posted as application/sdp straight through to the broker.
    location ^~ /api/voice/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    location = /admin { proxy_pass http://frontend:80; }
    location ^~ /admin/ { proxy_pass http://frontend:80; }
    location ^~ /assets/ { proxy_pass http://frontend:80; }
    location = /favicon.svg { proxy_pass http://frontend:80; }
    location = /favicon.ico { proxy_pass http://frontend:80; }
    # No community, quiz, form, account, public HTML, or uploads on this origin.
    location / { return 302 https://bossclinician.callsphere.site$request_uri; }
}
