# This virtual host serves only trusted SPA assets and admin API routes.
# Public/member content and uploaded documents always live on the public host.
server {
    listen 80;
    server_name admin.bossclinician.callsphere.site;
    client_max_body_size 512m;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://bossclinician.callsphere.site https://*.stripe.com; media-src 'self' https://bossclinician.callsphere.site blob:; connect-src 'self'; frame-src 'self' https://bossclinician.callsphere.site; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = / { return 302 /admin; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
    location = /admin { proxy_pass http://frontend:80; }
    location ^~ /admin/ { proxy_pass http://frontend:80; }
    location ^~ /assets/ { proxy_pass http://frontend:80; }
    location = /favicon.svg { proxy_pass http://frontend:80; }
    location = /favicon.ico { proxy_pass http://frontend:80; }
    # No community, quiz, form, account, public HTML, or uploads on this origin.
    location / { return 302 https://bossclinician.callsphere.site$request_uri; }
}
