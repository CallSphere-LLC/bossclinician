# 301s for the 125 indexed bossclinician.com URLs. Generated from the
# `redirects` table — see backend/scripts/generate-nginx-redirects.js. Served
# from a map rather than looked up per request so the marketing site keeps
# answering correctly while the API is restarting.
include /etc/nginx/conf.d/redirects.map;

# The default `combined` format logs $remote_addr and nothing about the
# forwarded chain, which made "what does the API think the client IP is?" a
# question nobody could answer from this host without adding instrumentation.
# It cost a deploy to find out once; it should not cost another.
#   real  = this container's peer (the docker bridge gateway — always the same)
#   fwd   = X-Forwarded-For exactly as Traefik handed it over
#   proto = X-Forwarded-Proto, which the HTTPS redirect below depends on
log_format bc_fwd '$remote_addr real=$remote_addr fwd="$http_x_forwarded_for" '
                  'proto=$http_x_forwarded_proto host=$host '
                  '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name bossclinician.callsphere.site _;

    access_log /var/log/nginx/access.log bc_fwd;

    # Course videos are uploaded through /api/admin/media. Must stay >= the
    # backend's MAX_UPLOAD_MB, otherwise nginx rejects the body first and the
    # client gets an HTML 413 instead of the API's JSON error.
    client_max_body_size 512m;

    # Nothing upstream compresses: the API has no compression middleware, and
    # the frontend container's gzip only covers files it serves itself. Without
    # this, every server-rendered marketing page — markup plus the inlined
    # JSON-LD and bootstrap data, a few hundred KB — and every admin list
    # response goes out at full size. `gzip_proxied any` is the line that makes
    # it apply to proxied responses at all.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    # text/html is always gzipped by nginx and cannot be listed here.

    # --- Force HTTPS. Traefik terminates TLS and forwards over HTTP, passing the
    # original scheme in X-Forwarded-Proto. ACME HTTP-01 is handled by cert-manager's
    # own solver upstream and never reaches this nginx, so redirecting here is safe.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # --- Security headers (applied to every response incl. errors via `always`).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/microphone/display-capture are opened to THIS ORIGIN ONLY, for the
    # community live room. They were closed outright, which is the right default
    # for a marketing site and silently fatal for a video room: getUserMedia
    # rejects with "Permissions policy violation" before the browser ever shows
    # a prompt, so the room looked like it was refusing consent nobody was asked
    # for. `self` is not `*` — no embedded third party gains anything here, and
    # frame-ancestors 'none' below means there is no embedding to worry about.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), display-capture=(self), payment=()" always;
    # The Instagram feed is the LightWidget embed bossclinician.com already uses:
    # its resizer script (cdn.lightwidget.com) plus the widget iframe
    # (lightwidget.com). `frame-src` is now explicit rather than inheriting
    # `default-src`, so widening it does not widen anything else. `frame-ancestors
    # 'none'` is untouched — this site still cannot be framed by anyone.
    # Stripe is listed on three directives because Stripe.js needs all three and
    # fails silently-ish without them: the library is loaded from js.stripe.com
    # by loadStripe(), the card fields are cross-origin iframes it opens on
    # js.stripe.com and hooks.stripe.com, and it talks to api.stripe.com
    # directly. Missing any one of them leaves the Checkout and member Billing
    # pages with a spinner where the payment form should be — no card can be
    # entered on the site at all. m.stripe.network is the fraud signal frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.lightwidget.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.stripe.com; connect-src 'self' https://api.stripe.com https://m.stripe.network https://r.stripe.com; frame-src https://lightwidget.com https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API → backend
    #
    # X-Forwarded-For is forwarded *as received* rather than appended to.
    # Traefik is the only writer of this header (it strips whatever a client
    # sends), and the API trusts exactly one proxy hop — app.ts, `trust proxy`
    # 1. Appending this container's view of its peer added a second entry, and
    # that entry — the docker bridge gateway, identical for every request — is
    # what Express then reported as req.ip.
    #
    # Read what this does and does not fix. It makes req.ip the outermost value
    # anyone in this chain knows, and it is what makes `trust proxy 1` correct.
    # It does NOT restore the visitor's address: the k3d loadbalancer in front
    # of Traefik is a plain TCP proxy and the Traefik Service runs
    # externalTrafficPolicy: Cluster, so the client IP is already gone by the
    # time Traefik writes the header. req.ip is still a constant, and per-IP
    # rate limiting — including the login limiter — is therefore still
    # per-site, not per-visitor. That is fixed by enabling PROXY protocol on
    # the k3d loadbalancer and the Traefik entrypoints together, not here; when
    # that happens this line starts carrying the real address with no further
    # change. See docs/bugs/infra.md.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        # A 500MB upload over a slow line takes far longer than the 60s default
        # send timeout, and buffering it to a temp file first adds latency for
        # no benefit when the backend streams straight to disk.
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    # Old bossclinician.com paths. Placed above every other location so a
    # legacy URL never reaches the SPA, which would answer 200 and leave the
    # crawler thinking the old page still exists at the old address.
    # The scheme is stated rather than inherited: Traefik terminates TLS and
    # forwards over plain HTTP, so $scheme here is "http" and a bare relative
    # target would send the visitor to an http:// URL that the HTTPS rule above
    # then bounces again. Two hops on every legacy link is a needless dilution
    # of the redirect for search engines and a visible flicker for people.
    # Targets are always site-relative paths — see the generator.
    if ($redirect_target != '') {
        return 301 https://$host$redirect_target;
    }
    if ($redirect_target_temp != '') {
        return 302 https://$host$redirect_target_temp;
    }

    # Crawler files → backend. These are generated from what is actually
    # published, so they cannot be static files in the frontend build. Without
    # these two exact-match blocks they fall through to the SPA below and answer
    # 200 with an HTML page, which is worse than a 404 — a crawler has no way to
    # tell it did not get a sitemap.
    location = /sitemap.xml {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unavailable;
    }

    location = /robots.txt {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unavailable;
    }

    # Deliberately not @spa. These two are the one pair of paths where falling
    # back to the SPA is the *worse* answer: a crawler that asked for a sitemap
    # and got an HTML document with a 200 has no way to tell it was fobbed off,
    # which is the failure the exact-match blocks above exist to prevent. A 503
    # carrying Retry-After is the documented "temporarily unavailable, keep my
    # index, come back" signal, and unlike the bare 502 nginx would otherwise
    # emit it does not read as a broken site.
    location @unavailable {
        add_header Retry-After 120 always;
        return 503;
    }

    # --- Server-rendered marketing pages → backend.
    #
    # These are the URLs a crawler asks for and the 125 legacy redirects land
    # on. The backend renders the React app to HTML so the article text, the
    # per-page title, the canonical and the JSON-LD are all in the response
    # before a single byte of JavaScript runs. Everything not listed here — the
    # member app, the admin, checkout, quizzes, forms, funnels — still reaches
    # the frontend container as the client-rendered shell it has always been.
    #
    # The list is the same one backend/src/routes/public/render.ts registers,
    # and the two have to be kept in step: a path here that the backend does not
    # render answers 404 from the API instead of reaching the SPA.
    location = / {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A render that cannot happen must cost the page its HTML and nothing
        # else: nginx falls back to the static shell, which is exactly what this
        # host served before. This also covers the API being down entirely —
        # the marketing site keeps answering while it restarts.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    # Two regexes, not one, and neither of them takes a wildcard segment it
    # cannot deliver.
    #
    # The single regex that used to stand here matched one optional extra
    # segment under all seventeen names, but the renderer registers a child
    # route for exactly two of them (`/courses/:slug`, `/blog/:slug` —
    # render.ts). Everything else it swept up — /about/x, /store/x, /terms/x,
    # /partners/dashboard, /resources/x and the rest — reached the API, matched
    # no route, and came back as the API's raw JSON 404 body. `error_page`
    # below only covers 5xx, so nothing rescued them, and before these paths
    # were routed here at all they had reached the SPA and rendered the branded
    # 404 page. Matching only what the renderer actually serves puts them back
    # there.
    #
    # This also makes the drift fail safe. The two lists still have to be kept
    # in step by hand, but a public route added under one of these names now
    # falls through to the SPA — a page that works, minus its server-rendered
    # HTML — instead of showing a visitor a JSON error.
    #
    # Trailing slash is allowed on purpose: Express matches /about/ to /about,
    # so the server-rendered version is served rather than pushed to the SPA.

    # The pages with no children.
    location ~ ^/(about|work-with-me|partners|resources|resource-hub|apply|contact|retreats|store|practice-quiz|practice-reset-planner|privacy-policy|terms|disclaimer|financial-disclaimer)/?$ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    # The two that do have children: the course and post detail pages, which is
    # where 55 of the legacy product URLs and every blog redirect land. One
    # segment only — /courses/a/b is not a route either.
    location ~ ^/(courses|blog)(/[^/]+)?/?$ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    # Deliberately no 404 in those error_page lists. A blog post that does not
    # exist is rendered by the API as a real 404 document; turning that into an
    # SPA shell would answer 200 to a crawler for a page that is gone, which is
    # the soft-404 the server-rendering work exists to avoid.

    location @spa {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never forwarded: without this a client-supplied X-Real-IP would
        # reach the API verbatim. Nothing reads it today; this keeps it from
        # becoming a trap the day something does.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Uploaded media (blog covers, testimonial photos) → backend static
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never forwarded: without this a client-supplied X-Real-IP would
        # reach the API verbatim. Nothing reads it today; this keeps it from
        # becoming a trap the day something does.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Frontend (SPA) — static build served by its own nginx container
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never forwarded: without this a client-supplied X-Real-IP would
        # reach the API verbatim. Nothing reads it today; this keeps it from
        # becoming a trap the day something does.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
