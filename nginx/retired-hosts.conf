# Retired by owner request, 2026-10-26. TLS stays valid for terminal responses.
# The former public host retains only signed POST callbacks during migration.
server {
    listen 80;
    server_name bossclinician.callsphere.site;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~ ^/api/(stripe/webhook|paypal/webhook|email/webhook/ses)$ {
        if ($request_method != POST) { return 410; }
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        return 410 "This address is no longer available.\nVisit https://www.bossclinician.com/\n";
    }
}
