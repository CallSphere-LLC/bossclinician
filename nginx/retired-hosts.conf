# Retired by owner request, 2026-10-26. TLS stays valid for terminal responses.
# Signed POST callbacks remain. One verified CWC email path redirects to www.
server {
    listen 80;
    server_name bossclinician.callsphere.site;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /library/credential-with-confidence/lessons/credential-with-confidence-quiz {
        if ($request_method !~ ^(GET|HEAD)$) { return 410; }
        # Nginx location matching normalizes paths; require the exact raw path too.
        if ($request_uri !~ "^/library/credential-with-confidence/lessons/credential-with-confidence-quiz(\?.*)?$") { return 410; }
        return 302 https://www.bossclinician.com/library/credential-with-confidence/lessons/credential-with-confidence-quiz$is_args$args;
    }
    location ~ ^/api/(stripe/webhook|paypal/webhook|email/webhook/ses)$ {
        if ($request_method != POST) { return 410; }
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        return 410 "This address is no longer available.\nVisit https://www.bossclinician.com/\n";
    }
}
