server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # `^~` on the two static prefixes: without it the file-extension regex below
    # would win for /assets/app.js and these cache headers would be lost. Their
    # behaviour is otherwise unchanged — neither ever fell back to index.html.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # The stock mime.types maps only .js. The PDF viewer's worker is emitted
        # as .mjs, and a module worker served as application/octet-stream is
        # refused by the browser.
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # The document shell must never be held by a browser cache. It carries the
    # content-hashed names of the JavaScript for this deploy and nothing else;
    # a cached copy from the previous deploy names files that no longer exist,
    # and the visitor gets a blank page until they hard-reload. With no
    # Cache-Control at all, browsers apply their own heuristic freshness from
    # Last-Modified, which is exactly that failure.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # A request for a *file* that does not exist is a 404, not the app.
    #
    # The SPA fallback below answered /favicon.ico, /apple-touch-icon.png,
    # /blog.rss and every mistyped image URL with HTTP 200 and the HTML shell. A
    # browser asking for an icon got a document; a crawler asking for a feed got
    # a page. Nothing the router serves ends in one of these extensions — the
    # one dotted client route, /account/.../receipt.pdf, is deliberately not
    # listed (and nginx/site.conf sends it to the API before it gets here).
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|css|js|mjs|map|json|txt|xml|rss|atom|woff2?|ttf|otf|eot|mp4|webm|mp3|wav|zip)$ {
        try_files $uri =404;
    }

    # SPA fallback — always serve index.html for unknown routes
    location / {
        # The fallback is an internal redirect to /index.html, so the block
        # above sets its headers.
        try_files $uri $uri/ /index.html;
    }
}
