server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # The document shell must never be held by a browser cache. It carries the
    # content-hashed names of the JavaScript for this deploy and nothing else;
    # a cached copy from the previous deploy names files that no longer exist,
    # and the visitor gets a blank page until they hard-reload. With no
    # Cache-Control at all, browsers apply their own heuristic freshness from
    # Last-Modified, which is exactly that failure.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback — always serve index.html for unknown routes
    location / {
        # The fallback is an internal redirect to /index.html, so the block
        # above sets its headers.
        try_files $uri $uri/ /index.html;
    }
}
